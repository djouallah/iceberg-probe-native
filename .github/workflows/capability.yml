name: catalog capability

# WHAT DOES THE ONELAKE ICEBERG REST CATALOG SUPPORT? One job per client, one at a time, about ten
# minutes. Its concurrency group keeps two capability runs off each other's tables. It commits
# nothing: the matrix is the step summary and the log; the findings land in readme.md.

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Which clients to ask.
        type: choice
        options:
          - pyiceberg,duckdb,sail,chdb,duckdb_isolation
          - pyiceberg
          - duckdb
          - sail
          - chdb
          - duckdb_isolation
        default: pyiceberg,duckdb,sail,chdb,duckdb_isolation
      keep:
        description: Leave the probe tables behind, to inspect them in Fabric.
        type: boolean
        default: false

concurrency:
  group: onelake-capability
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clients: ${{ steps.plan.outputs.clients }}
    steps:
      - id: plan
        run: |
          CLIENTS=$(printf '%s' "${{ inputs.clients || 'pyiceberg,duckdb,sail,chdb,duckdb_isolation' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "clients=$CLIENTS" >> "$GITHUB_OUTPUT"
          echo "clients: $CLIENTS"

  ask:
    needs: plan
    name: >-
      ${{ matrix.client == 'duckdb' && '🦆 DuckDB (pre-release)'
      || matrix.client == 'pyiceberg' && '🧊 pyiceberg'
      || matrix.client == 'sail' && '⛵ Sail'
      || matrix.client == 'chdb' && '🐭 chDB'
      || matrix.client == 'duckdb_isolation' && '🦆 DuckDB isolation and transactions'
      || matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      # One client's failure must not delete the other's answers.
      fail-fast: false
      max-parallel: 1
      matrix:
        client: ${{ fromJSON(needs.plan.outputs.clients) }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CAPABILITY_KEEP: ${{ inputs.keep && '1' || '0' }}
      REQS: >-
        requirements/${{ (matrix.client == 'duckdb' || matrix.client == 'duckdb_isolation') && 'duckdb_capability'
        || matrix.client == 'sail' && 'sail_capability'
        || matrix.client == 'chdb' && 'chdb_capability' || 'catalog' }}.txt
      SCRIPT: >-
        .github/scripts/${{ matrix.client == 'duckdb_isolation' && 'isolation_duckdb' || 'catalog_capability' }}${{ matrix.client == 'duckdb' && '_duckdb'
        || matrix.client == 'sail' && '_sail'
        || matrix.client == 'chdb' && '_chdb' || '' }}.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      # DuckDB's set is pyiceberg's plus the PRE-RELEASE duckdb, whose `>=2.0.0.dev0` pin is what
      # makes pip take a dev build. None installs another's.
      - name: Install ${{ matrix.client }}
        run: |
          pip install -r "$REQS"
          pip list --format=freeze | grep -Ei '^(pyiceberg|pyarrow|duckdb|pysail|chdb)=' || true

      # DuckDB is the nightly CLI, not a wheel: bench/duckdb_cli.py says why, and
      # .github/scripts/duckdb_nightly.py picks the newest nightly whose extensions are published.
      - name: DuckDB nightly CLI
        if: matrix.client == 'duckdb' || matrix.client == 'duckdb_isolation'
        uses: ./.github/actions/duckdb-nightly

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Ask the catalog, as ${{ matrix.client }}
        # `shell: bash` is pipefail. Without it `... | tee` exits 0 whatever the script did.
        shell: bash
        run: python "$SCRIPT" 2>&1 | tee "capability-${{ matrix.client }}.log"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: capability-${{ matrix.client }}
          path: capability-${{ matrix.client }}.log
          if-no-files-found: warn
